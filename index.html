<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>貓咪夢工廠｜養貓、上學、長大</title>
    <meta name="theme-color" content="#2f6f63" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css?v=20261018c" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="貓咪夢工廠" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <header class="topbar">
      <h1><span>🐾</span> 貓咪夢工廠</h1>
      <nav class="toolbar">
        <button id="themeBtn" title="切換深色／淺色">🌙</button
        ><div class="audio-ctrl-wrap">
          <button id="audioBtn" class="audio-btn" title="聲音設定（點擊快速靜音／長按或右鍵展開細調）" aria-label="聲音設定">🔊</button>
          <div id="audioPopup" class="audio-popup hidden" role="dialog" aria-label="音訊設定">
            <div class="audio-popup-title">🎵 聲音設定</div>
            <label class="audio-toggle-row">
              <span>背景音樂</span>
              <input type="checkbox" id="bgmToggle" />
            </label>
            <label class="audio-toggle-row">
              <span>遊戲音效</span>
              <input type="checkbox" id="sfxToggle" />
            </label>
          </div>
        </div>
      </nav>
    </header>

    <!-- 首頁：貓咪小屋 -->
    <main id="homeScreen" class="screen">
      <section class="card" id="petView"></section>
    </main>

    <div class="overlay hidden" id="overlay">
      <div class="sheet">
        <h2 id="overlayTitle">完成！</h2>
        <p id="overlayBody"></p>
        <div class="row">
          <button id="overlayPrimary" class="primary">下一題</button
          ><button id="overlaySecondary">關閉</button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/main.js?v=20261018"></script>
  </body>
</html>
